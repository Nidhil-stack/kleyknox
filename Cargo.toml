[package]
name = "kleyknox"
version = "0.1.0"
edition = "2024"
description = "SSH and GPG keys kept encrypted on a USB stick, unlocked with one passphrase"
license = "GPL-3.0-or-later"

[dependencies]
age = "0.11"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
ssh-key = { version = "0.6", features = ["ed25519", "encryption", "std"] }
zeroize = "1"

[profile.release]
strip = true
lto = true

# scrypt at 2^20 takes minutes unoptimized: build dependencies optimized in
# dev and test builds too, so `cargo test` stays quick.
[profile.dev.package."*"]
opt-level = 3
